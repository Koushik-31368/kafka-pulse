[tool.pyrefly]
python_interpreter = "venv311/Scripts/python.exe"
search_path = ["src"]
ignore = ["venv", "venv311", ".git"]

[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "Windows"
venvPath = "."
venv = "venv311"
typeCheckingMode = "basic"

[project]
name = "kafka-pulse"
version = "1.2.0"
description = "Real-time Kafka pipeline with PostgreSQL persistence"
requires-python = ">=3.11"
dependencies = [
    "kafka-python-ng>=2.2.3",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.0.1",
    "faker>=25.2.0",
    "rich>=13.7.1",
]
